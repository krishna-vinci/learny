name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Release tags must be vX.Y.Z or a semver prerelease')
          text = pathlib.Path('CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(tag) + r'\s*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not section or not section[1].strip():
              raise SystemExit('Missing CHANGELOG.md entry for ' + tag)
          pathlib.Path('release-notes.md').write_text(section[1].strip() + '\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/krishna-vinci/studium
          flavor: latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
