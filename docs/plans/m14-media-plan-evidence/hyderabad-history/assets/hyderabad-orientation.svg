<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" fill="none"><title>Hyderabad orientation: regional setting and city relationships</title><desc>Hyderabad lies in the Deccan Plateau of India. A city sketch places Golconda west of Charminar, the Old City south of the Musi, and Secunderabad north of Hussain Sagar. Only the three monument points and their scale are coordinate-based.</desc><g stroke="currentColor" fill="currentColor" font-family="sans-serif" font-size="18"><text x="30" y="32" stroke="none" font-size="24">From the Deccan to the city</text><rect x="30" y="55" width="740" height="90" rx="10" fill="none"/><text x="50" y="85" stroke="none">India → Deccan Plateau → Hyderabad, Telangana</text><text x="50" y="118" stroke="none">Regional locator: nested places, not a boundary map</text><rect x="30" y="165" width="740" height="470" rx="25" stroke-dasharray="8 6" fill="none"/><text x="50" y="195" stroke="none">Wider metropolis (extent schematic)</text><path d="M730 265V205m-8 12 8-12 8 12"/><text x="723" y="193" stroke="none">N</text><text x="390" y="235" stroke="none">Secunderabad</text><text x="390" y="258" stroke="none" font-size="15">cantonment origins; position schematic</text><ellipse cx="425" cy="300" rx="55" ry="23" fill="none" stroke="#267f99"/><text x="490" y="306" stroke="none">Hussain Sagar</text><text x="390" y="365" stroke="none">New Hyderabad</text><path d="M50 475Q220 440 360 467T750 465" stroke="#267f99" stroke-width="4" fill="none"/><text x="585" y="448" fill="#267f99" stroke="none">Musi (schematic)</text><circle cx="150" cy="400" r="6"/><text x="55" y="425" stroke="none">Golconda Fort</text><circle cx="110" cy="344" r="6"/><text x="50" y="322" stroke="none">Qutb Shahi Tombs</text><circle cx="523" cy="533" r="6"/><text x="540" y="537" stroke="none">Charminar</text><text x="450" y="575" stroke="none">Old City</text><path d="M70 587h250m-250-7v14m125-14v14m125-14v14" stroke-width="2"/><text x="65" y="620" stroke="none" font-size="15">0</text><text x="180" y="620" stroke="none" font-size="15">2.5</text><text x="303" y="620" stroke="none" font-size="15">5 km</text><text x="40" y="662" stroke="none" font-size="16">Scale applies only between monument dots; other features are schematic.</text></g></svg>