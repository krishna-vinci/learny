<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 590" role="img"><title>Functional groups in polymer monomers and link fragments</title><g font-family="system-ui,sans-serif" font-size="20" fill="currentColor"><text x="20" y="32">Look at the highlighted bonding pattern</text><text x="20" y="80">Ethene — alkene</text><text x="40" y="116" fill="#0072B2">CH₂=CH₂</text><text x="20" y="165">Ethylene glycol — two alcohol groups</text><text x="40" y="201"><tspan fill="#0072B2">HO</tspan>–CH₂–CH₂–<tspan fill="#0072B2">OH</tspan></text><text x="20" y="250">Adipic acid — two carboxylic acid groups</text><text x="40" y="286"><tspan fill="#0072B2">HO–C(=O)</tspan>–(CH₂)₄–<tspan fill="#0072B2">C(=O)–OH</tspan></text><text x="20" y="335">Hexanediamine — two amine groups</text><text x="40" y="371"><tspan fill="#0072B2">H₂N</tspan>–(CH₂)₆–<tspan fill="#0072B2">NH₂</tspan></text><text x="20" y="420">Polyester link fragment — ester</text><text x="40" y="456">R–<tspan fill="#0072B2">C(=O)–O</tspan>–R′</text><text x="20" y="505">Polyamide link fragment — amide</text><text x="40" y="541">R–<tspan fill="#0072B2">C(=O)–NH</tspan>–R′</text><text x="20" y="578" font-size="16">R and R′ stand for the rest of the carbon-containing structure.</text></g></svg>