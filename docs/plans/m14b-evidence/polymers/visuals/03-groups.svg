<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img"><title>Compare alkene and alcohol bonding patterns</title><rect width="360" height="280" fill="#fafaf9"/><g fill="#292524" font-family="system-ui,sans-serif" font-size="16"><text x="16" y="28">Select a group; compare its neighbors</text><rect x="16" y="62" width="328" height="65" rx="12" fill="none" stroke="#0072B2" stroke-width="2"/><text x="26" y="83">Alkene</text><text x="26" y="110" fill="#0072B2">CH₂=CH₂</text><rect x="16" y="135" width="328" height="65" rx="12" fill="none" stroke="#0072B2" stroke-width="2"/><text x="26" y="156">Alcohol</text><text x="26" y="183" fill="#57534e">R–</text><text x="65" y="183" fill="#0072B2">CH₂–OH</text><text x="16" y="231">C=C is an alkene; an O–H bond alone</text><text x="16" y="253">is not a carbon–carbon double bond.</text></g></svg>