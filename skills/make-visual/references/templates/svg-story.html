<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Follow a changing length</title>
<script type="application/json" id="studium-visual">{"libs":[],"story":true,"aspect":"9:7","posters":[{"src":"svg-story.svg","narration":"Begin with a one-metre segment."},{"src":"svg-story-mid.svg","narration":"Double the segment length to two metres."},{"src":"svg-story-end.svg","narration":"Three metres is three times the starting length."}]}</script>
</head><body><script>
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
  if (parent) parent.append(node);
  return node;
}
function label(svg, value, x, y, width, height, color, font) {
  const node = el("text", {fill: color, "font-family": font}, svg);
  el("title", {}, node).textContent = value;
  let size = 18, lines = [];
  const measure = word => { node.setAttribute("font-size", size); node.append(document.createTextNode(word)); const length = node.getComputedTextLength(); node.lastChild.remove(); return length; };
  for (; size >= 12; size--) {
    lines = [""];
    for (const word of String(value).split(/\s+/)) {
      const pieces = measure(word) > width ? [...word] : [word];
      for (const piece of pieces) {
        const gap = pieces.length === 1 && lines[lines.length - 1] ? " " : "";
        const next = lines[lines.length - 1] + gap + piece;
        if (measure(next) <= width) lines[lines.length - 1] = next;
        else lines.push(piece);
      }
    }
    if (lines.length * (size + 4) <= height) break;
  }
  size = Math.max(12, size);
  const maxLines = Math.max(1, Math.floor(height / (size + 4)));
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (last && measure(last + "…") > width) last = last.slice(0, -1);
    lines[maxLines - 1] = last + "…";
  }
  node.setAttribute("font-size", size);
  lines.forEach((line, i) => el("tspan", {x, y: y + size + i * (size + 4)}, node).textContent = line);
  return node;
}
/* FILL: title, scenes' numeric lengths (1–3) and narration; update header posters too. */
const title = "Watch a segment grow";
const scenes = [{"state": {"length": 1}, "narration": "Begin with a one-metre segment."}, {"state": {"length": 2}, "narration": "Double the segment length to two metres."}, {"state": {"length": 3}, "narration": "Three metres is three times the starting length."}];
const svg = el("svg", {viewBox: "0 0 360 280", role: "img", "aria-label": title});
svg.style.width = "100%"; svg.style.height = "100%";
function draw({state, theme}) {
  svg.replaceChildren();
  const fg = theme.fg ?? "#292524", muted = theme.muted ?? "#57534e", font = theme.font ?? "system-ui, sans-serif";
  label(svg, title, 16, 12, 328, 60, fg, font);
  const length = Math.max(1, Math.min(3, state.length ?? 1));
  el("line", {x1: 30, x2: 30 + 90 * length, y1: 140, y2: 140, stroke: studium.palette[0], "stroke-width": 8}, svg);
  for (let i = 0; i <= length; i++) {
    el("line", {x1: 30 + i * 90, x2: 30 + i * 90, y1: 124, y2: 156, stroke: fg, "stroke-width": 2}, svg);
    label(svg, String(i), 22 + i * 90, 164, 36, 32, muted, font);
  }
  label(svg, "Length: " + length + " m", 16, 224, 328, 36, fg, font);
}
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("studium-stage").append(svg);
  studium.mount({scenes, draw});
});
</script></body></html>
